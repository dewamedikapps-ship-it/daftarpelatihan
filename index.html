        </svg>
      </div>
      <div class="daftar" id="daftar" aria-live="polite">
        <div class="pembuka" id="pembuka">
          <p>Halo Kak 😊 Mau tanya jadwal, syarat, atau cara daftar pelatihan? Pilih topiknya di bawah atau tulis saja pertanyaannya.</p>
          <div class="saran" role="group" aria-label="Contoh pertanyaan">${SARAN.map(function(s){return '<button type="button">'+s+'</button>';}).join("")}</div>
        </div>
      </div>
      <div class="sr" id="statusBaca" aria-live="assertive"></div>
      <div class="menu" id="menu" role="group" aria-label="Topik cepat">
        <button type="button">Jadwal terdekat</button><button type="button">Cara daftar</button>
        <button type="button">Biaya pelatihan</button><button type="button">Pelatihan apa saja</button>
        <button type="button">Hubungi admin</button>
      </div>
      <form id="form" autocomplete="off">
        <label for="isi" class="sr">Tulis pertanyaan</label>
        <textarea id="isi" rows="1" maxlength="800" placeholder="Tulis pertanyaan Kakak…"></textarea>
        <input class="jebakan" id="situs" tabindex="-1" aria-hidden="true">
        <button class="kirim" id="tombol" type="submit">Kirim</button>
      </form>
      <p class="kaki">Dijawab otomatis dari informasi resmi DMN; hal khusus diteruskan ke admin. Jangan kirim data sensitif seperti NIK atau nomor rekening.</p>
    </section>
  </div>`;

  function pasang(){
    var host = document.createElement("div");
    host.id = "dmn-tanya-widget";
    document.body.appendChild(host);
    var akar = host.attachShadow ? host.attachShadow({mode:"open"}) : host;
    akar.innerHTML = "<style>" + CSS + "</style>" + HTML;
    var $ = function(id){ return akar.getElementById ? akar.getElementById(id) : akar.querySelector("#"+id); };

    var w = $("w"), pemicu = $("pemicu"), panel = $("panel"), tutup = $("tutup"), daftar = $("daftar"),
        form = $("form"), isi = $("isi"), tombol = $("tombol"), statusBaca = $("statusBaca"), label = $("label");
    var pembuka = $("pembuka");
    var terlihat = {}, jamKerja = "08.00–17.00 WIB", menunggu = false, batasTunggu = 0, pengatur = null,
        sudahMuat = false, dibuka = false;

    function uuid(){
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
        var r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); });
    }
    var sesi = null;
    try { sesi = localStorage.getItem(KUNCI); } catch(e) {}
    if (!sesi || !/^[0-9a-f-]{36}$/.test(sesi)) { sesi = uuid(); try { localStorage.setItem(KUNCI, sesi); } catch(e) {} }

    function amankan(t){ return String(t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
    function tautkan(t){ return amankan(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
    function jam(v){ try { return new Date(v).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }
    function gulir(){ daftar.scrollTop = daftar.scrollHeight; }
    function buangPembuka(){ if (pembuka) { pembuka.remove(); pembuka = null; } }

    function tampilkan(p){
      if (p.id && terlihat[p.id]) return false;
      if (p.id) terlihat[p.id] = true;
      buangPembuka();
      var d = document.createElement("div");
      d.className = "pesan " + (p.dari === "anda" ? "anda" : "dmn");
      d.innerHTML = (p.dari === "anda" ? amankan(p.isi) : tautkan(p.isi)) +
        (p.waktu ? '<span class="waktu">' + (p.dari === "anda" ? "" : "DMN, ") + jam(p.waktu) + "</span>" : "");
      daftar.appendChild(d); return true;
    }
    function catat(teks, galat){
      buangPembuka();
      var d = document.createElement("div"); d.className = "catatan" + (galat ? " galat" : ""); d.textContent = teks;
      daftar.appendChild(d); gulir();
    }
    function hapusPilihan(){ akar.querySelectorAll(".pilihan").forEach(function(x){ x.remove(); }); }
    function tampilkanPilihan(daftarSaran){
      if (!daftarSaran || !daftarSaran.length) return;
      var d = document.createElement("div"); d.className = "pilihan";
      daftarSaran.forEach(function(t){
        var b = document.createElement("button"); b.type = "button"; b.textContent = t;
        b.addEventListener("click", function(){ kirim(t); });
        d.appendChild(b);
      });
      daftar.appendChild(d); gulir();
    }
    function berpikir(ya){ w.classList.toggle("berpikir", ya); statusBaca.textContent = ya ? "Sedang menyusun jawaban" : ""; tombol.disabled = ya; }

    async function panggil(badan){
      var r = await fetch(API, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(badan)});
      var j = {}; try { j = await r.json(); } catch(e) {}
      if (!r.ok) throw new Error(j.galat || "Pesan belum terkirim, Kak. Periksa koneksi internet lalu coba kirim lagi ya.");
      return j;
    }
    async function tarik(diam){
      try {
        var j = await panggil({aksi:"tarik", sesi:sesi});
        if (j.jam_kerja) jamKerja = j.jam_kerja;
        var baru = false;
        (j.pesan || []).forEach(function(p){
          if (sudahMuat && p.dari === "anda") { terlihat[p.id] = true; return; }
          if (tampilkan(p) && p.dari === "dmn") baru = true;
        });
        sudahMuat = true;
        if (baru) { menunggu = false; gulir(); if (!dibuka) label.textContent = "Ada balasan dari DMN"; }
        return j;
      } catch(e) { if (!diam) catat(e.message, true); return null; }
    }
    function mulaiMenunggu(){
      menunggu = true; batasTunggu = Date.now() + 30*60*1000;
      if (pengatur) return;
      pengatur = setInterval(function(){
        if (!menunggu || Date.now() > batasTunggu) { clearInterval(pengatur); pengatur = null; return; }
        if (document.visibilityState === "visible") tarik(true);
      }, 15000);
    }
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && sudahMuat) tarik(true); });

    async function kirim(teks){
      teks = (teks || "").trim(); if (!teks) { isi.focus(); return; }
      hapusPilihan();
      tampilkan({dari:"anda", isi:teks, waktu:new Date().toISOString()}); gulir();
      isi.value = ""; ukur(); berpikir(true);
      try {
        var j = await panggil({aksi:"kirim", sesi:sesi, isi:teks, situs:$("situs").value});
        if (j.jam_kerja) jamKerja = j.jam_kerja;
        if (j.status === "terjawab" && j.balasan) {
          tampilkan(j.balasan); gulir();
          if (j.diteruskan) { catat("Admin juga sudah menerima pesan ini, Kak. Balasannya muncul di sini pada jam kerja (" + jamKerja + ")."); mulaiMenunggu(); }
          tampilkanPilihan(j.saran);
        }
        else if (j.status === "tutup") catat(j.pemberitahuan || "Chat sedang tidak aktif, Kak. Info jadwal dan pendaftaran tetap bisa dilihat di halaman ini.");
        else if (j.status === "ditangani") { catat("Pesan Kakak sudah diterima admin. Balasannya akan muncul di sini, Kak."); mulaiMenunggu(); }
        else { tampilkanPilihan(j.saran); catat("Pertanyaan Kakak sudah diteruskan ke admin. Balasannya muncul di sini pada jam kerja (" + jamKerja + "). Buka lagi halaman ini dari HP yang sama untuk melihatnya ya."); mulaiMenunggu(); }
      } catch(e) { catat(e.message, true); }
      finally { berpikir(false); isi.focus(); }
    }

    function ukur(){ isi.style.height = "auto"; isi.style.height = Math.min(isi.scrollHeight, 110) + "px"; }
    isi.addEventListener("input", ukur);
    isi.addEventListener("keydown", function(e){
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches) {
        e.preventDefault(); if (!tombol.disabled) kirim(isi.value);
      }
    });
    form.addEventListener("submit", function(e){ e.preventDefault(); if (!tombol.disabled) kirim(isi.value); });
    akar.querySelectorAll(".saran button").forEach(function(b){ b.addEventListener("click", function(){ kirim(b.textContent); }); });
    akar.querySelectorAll(".menu button").forEach(function(b){ b.addEventListener("click", function(){ if (!tombol.disabled) kirim(b.textContent); }); });

    function buka(){
      dibuka = true; panel.hidden = false; pemicu.hidden = true;
      label.textContent = "Butuh Bantuan?";
      if (!sudahMuat) tarik(true).then(function(j){
        if (j && (j.pesan||[]).length && j.pesan[j.pesan.length-1].dari === "anda") mulaiMenunggu();
        gulir();
      });
      setTimeout(function(){ isi.focus(); gulir(); }, 50);
    }
    function tutupPanel(){ dibuka = false; panel.hidden = true; pemicu.hidden = false; pemicu.focus(); }
    pemicu.addEventListener("click", buka);
    tutup.addEventListener("click", tutupPanel);
    panel.addEventListener("keydown", function(e){ if (e.key === "Escape") tutupPanel(); });

    // Link langsung: daftarpelatihan.dewamedik911.com/#tanya atau ?tanya membuka chat otomatis.
    // Dipakai di pesan sapaan WhatsApp, bio Instagram, dan balasan cepat admin.
    function cekLinkLangsung(){
      var q = new URLSearchParams(location.search);
      if (location.hash === "#tanya" || q.has("tanya")) buka();
    }
    window.addEventListener("hashchange", cekLinkLangsung);
    cekLinkLangsung();

    // Pengunjung yang pernah bertanya: cek diam-diam apakah admin sudah membalas.
    tarik(true).then(function(j){
      if (!j) return;
      var ps = j.pesan || [];
      if (ps.length && ps[ps.length-1].dari === "anda") mulaiMenunggu();
      if (ps.length && ps[ps.length-1].dari === "dmn" && !dibuka) {
        try {
          var dilihat = localStorage.getItem(KUNCI + "_dilihat");
          if (dilihat !== String(ps[ps.length-1].id)) {
            label.textContent = "Ada balasan dari DMN";
            localStorage.setItem(KUNCI + "_dilihat", String(ps[ps.length-1].id));
          }
        } catch(e) {}
      }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", pasang); else pasang();
})();
</script>
<!-- ===================== akhir widget Tanya Admin DMN ===================== -->
