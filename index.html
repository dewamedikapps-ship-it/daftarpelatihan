<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Pelatihan - Akademia DEWAMEDIK</title>
<meta name="description" content="Pendaftaran pelatihan BTCLS, ACLS, dan pelatihan kesehatan lainnya di Akademia DEWAMEDIK.">
<style>body{margin:0;background:#EDF2F1;}#akar{min-height:100vh;}
#galat{font-family:system-ui;padding:24px;color:#C81E4A;white-space:pre-wrap;}</style>
<style id="dm-kalender-jadwal">
.dm-kal{background:var(--dm-surface,#fff);border:1px solid var(--dm-border,#DDE6E8);border-radius:var(--dm-radius-md,14px);overflow:hidden;}
.dm-kal-kepala{display:flex;align-items:center;gap:6px;padding:14px 16px 10px;}
.dm-kal-judul{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--dm-text,#102A33);margin:0 auto 0 0;}
.dm-kal-nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--dm-border,#DDE6E8);background:#fff;color:var(--dm-teal-600,#0E7C7B);font-size:17px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.dm-kal-nav:hover{background:var(--dm-teal-100,#E4F5F4);}
.dm-kal-kini{border:none;background:transparent;color:var(--dm-teal-600,#0E7C7B);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;padding:7px 11px;border-radius:9px;}
.dm-kal-kini:hover{background:var(--dm-teal-100,#E4F5F4);}
.dm-kal-namahari{display:grid;grid-template-columns:repeat(7,1fr);padding:0 0 8px;}
.dm-kal-namahari span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dm-text-secondary,#62747B);}
.dm-kal-pekan{position:relative;border-top:1px solid var(--dm-border,#DDE6E8);}
.dm-kal-sel-lapis{display:grid;grid-template-columns:repeat(7,1fr);}
.dm-kal-sel{padding:6px 6px 4px;border-left:1px solid #EEF3F4;}
.dm-kal-sel:first-child{border-left:none;}
.dm-kal-pekanan{background:#FAFCFC;}
.dm-kal-angka{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;font-size:13.5px;font-weight:600;color:var(--dm-text,#102A33);}
.dm-kal-luar .dm-kal-angka{color:#AEBCC2;}
.dm-kal-kinisel .dm-kal-angka{background:var(--dm-red-600,#D51F4B);color:#fff;}
.dm-kal-acara{position:absolute;left:0;right:0;top:36px;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:20px;gap:3px 2px;padding:0 3px;pointer-events:none;}
.dm-kal-bar{pointer-events:auto;border:none;border-radius:6px;background:var(--dm-navy-800,#16304C);color:#fff;font:inherit;font-size:11.5px;font-weight:700;line-height:20px;height:20px;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 2px rgba(6,26,35,.18);}
.dm-kal-bar:hover{filter:brightness(1.12);}
.dm-kal-tutup{opacity:.45;}
.dm-kal-potkiri{border-top-left-radius:2px;border-bottom-left-radius:2px;}
.dm-kal-potkanan{border-top-right-radius:2px;border-bottom-right-radius:2px;}
.dm-kal-kaki{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--dm-border,#DDE6E8);font-size:12px;color:var(--dm-text-secondary,#62747B);}
.dm-kal-legenda{display:inline-flex;align-items:center;gap:6px;}
.dm-kal-titik{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--dm-navy-800,#16304C);}
.dm-kal-kosong{padding:22px 16px;text-align:center;font-size:13.5px;color:var(--dm-text-secondary,#62747B);}
@media(max-width:760px){.dm-kal-judul{font-size:17px;}.dm-kal-bar{font-size:10px;padding:0 5px;}.dm-kal-sel{padding:4px 3px;}.dm-kal-angka{min-width:22px;height:22px;font-size:12px;}.dm-kal-acara{top:30px;}}
</style>
<style id="dm-kerjasama">
.dm-ks{border-top:3px solid var(--dm-teal-600,#087F83);scroll-margin-top:96px;}
.dm-ks-daftar{display:flex;flex-direction:column;gap:12px;}
.dm-ks-baris{display:grid;grid-template-columns:1fr 220px;gap:16px;border:1px solid var(--dm-border,#DDE6E8);
  border-radius:var(--dm-radius-md,14px);padding:15px 17px;background:var(--dm-surface,#fff);}
.dm-ks-baru{border-left:3px solid var(--dm-teal-600,#087F83);background:var(--dm-teal-100,#DDF4F3);}
.dm-ks-utama b{font-size:15.5px;font-weight:800;color:var(--dm-text,#102A33);}
.dm-ks-waktu{display:block;font-size:12px;color:var(--dm-text-secondary,#62747B);margin-top:2px;}
.dm-ks-pic{margin:8px 0 2px;font-size:13.5px;font-weight:600;color:var(--dm-text,#102A33);}
.dm-ks-kontak{margin:0 0 7px;font-size:13px;color:var(--dm-text-secondary,#62747B);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.dm-ks-butuh{margin:0 0 3px;font-size:13px;color:var(--dm-text-secondary,#62747B);line-height:1.55;}
.dm-ks-tanda{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--dm-red-600,#D51F4B);background:var(--dm-red-100,#FCE7ED);
  border-radius:999px;padding:3px 11px;}
.dm-ks-catatan{margin:9px 0 0;font-size:13px;font-style:italic;line-height:1.6;color:var(--dm-text,#102A33);}
.dm-ks-internal{margin:7px 0 0;font-size:12.5px;line-height:1.6;color:var(--dm-text-secondary,#62747B);
  border-left:2px solid var(--dm-border,#DDE6E8);padding-left:10px;}
.dm-ks-aksi{display:flex;flex-direction:column;gap:8px;align-self:start;}
.dm-ks-aksi .dm-input{padding:8px 10px;font-size:13px;}
.dm-modal-latar{position:fixed;inset:0;background:rgba(6,26,35,.55);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:80;}
.dm-modal{background:var(--dm-surface,#fff);border-radius:var(--dm-radius-lg,18px);padding:22px 24px;
  max-width:520px;width:100%;box-shadow:var(--dm-shadow-lg,0 18px 50px rgba(6,26,35,.12));}
.dm-modal h3{margin:0 0 5px;font-size:17px;font-weight:800;color:var(--dm-text,#102A33);}
@media (max-width:820px){.dm-ks-baris{grid-template-columns:1fr;}.dm-ks-aksi{flex-direction:row;flex-wrap:wrap;}}
.dm-navlink a.dm-nav-ks{border:1.5px solid var(--dm-teal-600,#087F83);color:var(--dm-teal-600,#087F83);
  border-radius:999px;padding:7px 15px;font-weight:700;line-height:1;
  transition:background 180ms,color 180ms,border-color 180ms;}
.dm-navlink a.dm-nav-ks:hover{background:var(--dm-teal-600,#087F83);color:#fff;border-color:var(--dm-teal-600,#087F83);}
@media (max-width:820px){.dm-navlink a.dm-nav-ks{padding:6px 12px;}}
.dm-ks-kepala{margin-bottom:var(--dm-s5,20px);}
.dm-ks-label{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dm-teal-600,#087F83);background:var(--dm-teal-100,#DDF4F3);border-radius:999px;padding:5px 13px;margin-bottom:10px;}
.dm-ks-kepala h3{margin:0 0 7px;font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--dm-text,#102A33);}
.dm-ks-kepala p{margin:0;font-size:14.5px;line-height:1.65;color:var(--dm-text-secondary,#62747B);max-width:62ch;}
.dm-ks-cip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.dm-ks-cip-btn{border:1px solid var(--dm-border,#DDE6E8);background:var(--dm-surface,#fff);color:var(--dm-text,#102A33);
  border-radius:999px;padding:8px 15px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:background 180ms,border-color 180ms,color 180ms;}
.dm-ks-cip-btn:hover{border-color:var(--dm-teal-600,#087F83);color:var(--dm-teal-600,#087F83);}
.dm-ks-cip-btn.aktif{background:var(--dm-teal-600,#087F83);border-color:var(--dm-teal-600,#087F83);color:#fff;}
.dm-ks-pilih{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.dm-ks-pilih-item{text-align:left;border:1px solid var(--dm-border,#DDE6E8);background:var(--dm-surface,#fff);
  border-radius:var(--dm-radius-md,14px);padding:13px 15px;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;gap:3px;transition:border-color 180ms,background 180ms;}
.dm-ks-pilih-item:hover{border-color:var(--dm-teal-600,#087F83);}
.dm-ks-pilih-item b{font-size:14px;font-weight:700;color:var(--dm-text,#102A33);}
.dm-ks-pilih-item span{font-size:12.5px;line-height:1.5;color:var(--dm-text-secondary,#62747B);}
.dm-ks-pilih-item.aktif{border-color:var(--dm-teal-600,#087F83);background:var(--dm-teal-100,#DDF4F3);}
.dm-ks-pilih-item.aktif b{color:var(--dm-teal-600,#087F83);}
.dm-ks-catatan{min-height:104px;resize:vertical;line-height:1.6;font-family:inherit;}
.dm-ks-centang{display:flex;gap:10px;align-items:flex-start;margin-top:13px;cursor:pointer;
  font-size:13.5px;line-height:1.6;color:var(--dm-text-secondary,#62747B);}
.dm-ks-centang input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--dm-teal-600,#087F83);}
.dm-ks-beres{text-align:center;padding:22px 8px;}
.dm-ks-beres h3{margin:0 0 9px;font-size:19px;font-weight:800;color:var(--dm-teal-600,#087F83);}
.dm-ks-beres p{margin:0 auto 10px;max-width:52ch;font-size:14.5px;line-height:1.65;color:var(--dm-text,#102A33);}
@media (max-width:620px){.dm-ks-kepala h3{font-size:19px;}.dm-ks-pilih{grid-template-columns:1fr;}}
</style>
</head><body>
<div id="akar"></div><div id="galat"></div>
<script>window.onerror=function(m){document.getElementById("galat").textContent="Terjadi kesalahan: "+m;};</script>

var CSS="\n@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');\n\n.dm-root{\n  --ink:#0B1F2A; --ink2:#24404F; --paper:#EDF2F1; --surface:#FFFFFF;\n  --line:#D3DEDB; --teal:#0E7C7B; --teal-d:#0A5F5E; --vital:#C81E4A;\n  --muted:#5F7580; --wait:#8A6100;\n  background:\n    radial-gradient(1100px 460px at 88% -8%, rgba(14,124,123,.10), transparent 62%),\n    radial-gradient(760px 380px at -6% 4%, rgba(200,30,74,.07), transparent 60%),\n    var(--paper);\n  color:var(--ink);\n  font-family:Inter,system-ui,sans-serif; font-size:15px; line-height:1.55; min-height:100vh;\n}\n.dm-root *{box-sizing:border-box;}\n.dm-wrap{max-width:1080px;margin:0 auto;padding:0 18px;}\n.dm-main{padding-top:22px;padding-bottom:150px;}\n\n.dm-header{background:linear-gradient(120deg,#071620 0%,var(--ink) 45%,#123044 100%);\n  color:#EAF2F1;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(126,231,214,.16);}\n.dm-header-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;flex-wrap:nowrap;}\n.dm-brand{display:flex;align-items:center;gap:14px;min-width:0;}\n.dm-mark{width:62px;height:69px;border-radius:11px;object-fit:cover;background:#fff;flex:none;\n  padding:3px;box-shadow:0 0 0 1px rgba(126,231,214,.35),0 6px 18px -8px rgba(0,0,0,.7);\n  transition:transform .18s ease;}\n.dm-mark:hover{transform:scale(1.04);}\n@media (max-width:820px){.dm-mark{width:50px;height:56px;}}\n.dm-brand b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;\n  letter-spacing:-.02em;line-height:1.15;color:#fff;}\n@media (max-width:820px){.dm-brand b{font-size:15.5px;}}\n.dm-brand i{display:block;font-style:normal;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;\n  font-size:13.5px;color:#A9CBC9;letter-spacing:.01em;max-width:36ch;line-height:1.2;margin-top:2px;}\n.dm-nav,. gka em{font-style:normal;font-size:.45em;margin-left:3px;color:#9FC3C0;font-weight:700;}\n.dm-angka span{display:block;margin-top:7px;font-size:12px;line-height:1.4;color:#C9DCDA;}\n.dm-angka-rinci{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.dm-angka-rinci div{display:flex;align-items:center;gap:10px;padding:11px 13px;\n  border:1px solid rgba(255,255,255,.12);border-radius:11px;}\n.dm-angka-rinci b{font-size:18px;color:#fff;flex:none;}\n.dm-angka-rinci span{font-size:12px;line-height:1.35;color:#9FC3C0;}\n.dm-survei-ringkas{margin:18px auto 0;max-width:62ch;text-align:center;font-size:13.5px;\n  line-height:1.6;color:#C9DCDA;}\n.dm-testi-judul{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;letter-spacing:.06em;\n  text-transform:uppercase;color:#7EE7D6;text-align:center;margin:26px 0 14px;}\n.dm-testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}\n.dm-testi{margin:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);\n  border-radius:14px;padding:15px;}\n.dm-testi blockquote{margin:9px 0 12px;font-size:13.5px;line-height:1.6;color:#EAF2F1;}\n.dm-testi figcaption b{display:block;font-size:13px;color:#fff;}\n.dm-testi figcaption span{display:block;font-size:11.5px;color:#9FC3C0;margin-top:2px;}\n.dm-testi figcaption em{font-style:normal;color:#7EE7D6;}\n.dm-bintang{color:#F5B301;font-size:14px;letter-spacing:2px;}\n.dm-bintang-sisa{color:rgba(255,255,255,.22);}\n.dm-survei-kaki{margin:20px auto 0;max-width:60ch;text-align:center;font-size:11.5px;line-height:1.6;\n  color:#7F9E9C;border-top:1px solid rgba(255,255,255,.13);padding-top:14px;}\n.dm-textarea-besar{font-size:14px;font-family:Inter,system-ui,sans-serif;}\n@media (max-width:820px){\n  .dm-angka-utama,.dm-angka-rinci{grid-template-columns:1fr;}\n  .dm-survei{padding:22px 16px;}\n}\n\n/* --- Berkarir bersama Dewa Medik --- */\n.dm-karir{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24 ricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(15px,2.2vw,19px);\n  letter-spacing:-.01em;margin:0 0 16px;color:#fff;}\n.dm-footer h4{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:.06em;\n  font-size:15px;margin:0;color:#fff;text-transform:uppercase;}\n.dm-motto{margin:3px 0 16px;font-size:13px;color:#8FB0AF;font-style:italic;}\n.dm-sosial{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font-size:13.5px;}\n.dm-sosial a{color:#B7CFCD;text-decoration:none;border:1px solid rgba(255,255,255,.22);\n  border-radius:999px;padding:5px 13px;}\n.dm-sosial a:hover{background:rgba(255,255,255,.1);color:#fff;}\n.dm-handle{font-family:'JetBrains Mono',monospace;color:var(--vital);font-size:13.5px;padding-left:4px;}\n.dm-situs{display:inline-block;margin-top:14px;color:#fff;font-size:14px;font-weight:600;\n  text-decoration:none;border-bottom:2px solid var(--vital);padding-bottom:2px;}\n.dm-footer-kecil{margin:18px 0 0;font-size:12px;color:#7F9E9C;line-height:1.6;}\n.dm-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;}\n\n@media (max-width:820px){\n  .dm-grid2,.dm-berkas-grid{grid-template-columns:1fr;}\n  .dm-bar-in{gap:10px;}\n  .dm-bar-in .dm-btn{width:100%;}\n}\n\n/* ============================================================\n   REDESIGN TAHAP 2 — DESIGN SYSTEM & HALAMAN PESERTA\n   Ditempatkan di akhir agar menimpa aturan lama lewat cascade.\n   Kelas back office lama tidak dihapus, hanya diselaraskan.\n   ============================================================ */\n\n.dm-root{\n  --dm-navy-950:#061A23; --dm-navy-900:#082630; --dm-navy-800:#0B3540;\n  --dm-teal-600:#087F83;  --dm-teal-500:#0A969A; --dm-teal-100:#DDF4F3;\n  --dm-red-600:#D51F4B;   --dm-red-100:#FCE7ED;\n  --dm-bg:#F5F8F8; --dm-surface:#FFFFFF; --dm-surface-soft:#F8FAFA;\n  --dm-text:#102A33; --dm-text-secondary:#62747B; --dm-border:#DDE6E8;\n  --dm-success:#16865A; --dm-warning:#C77A16; --dm-danger:#C83D4D;\n\n  --dm-radius-sm:10px; --dm-radius-md:14px; --dm-radius-lg:18px; --dm-radius-xl:24px;\n  --dm-shadow-sm:0 2px 8px rgba(6,26,35,.05);\n  --dm-shadow-md:0 8px 30px rgba(6,26,35,.08);\n  --dm-shadow-lg:0 18px 50px rgba(6,26,35,.12);\n\n  --dm-s1:4px; --dm-s2:8px; --dm-s3:12px; --dm-s4:16px; --dm-s5:20px;\n  --dm-s6:24px; --dm-s8:32px; --dm-s10:40px; --dm-s12:48px; --dm-s16:64px;\n\n  --dm-t:180ms cubic-bezier(.22,.61,.36,1);\n\n  /* token lama dipetakan ke token baru agar back office ikut selaras */\n  --ink:var(--dm-navy-950); --ink2:#22414C; --paper:var(--dm-bg);\n  --surface:var(--dm-surface); --line:var(--dm-border);\n  --teal:var(--dm-teal-500); --teal-d:var(--dm-teal-600);\n  --vital:var(--dm-red-600); --muted:var(--dm-text-secondary); --wait:var(--dm-warning);\n\n  font-family:\"Plus Jakarta Sans\",\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  font-size:15.5px; line-height:1.6; color:var(--dm-text);\n  background:\n    radial-gradient(900px 420px at 92% -6%, rgba(10,150,154,.09), transparent 60%),\n    radial-gradient(700px 340px at -4% 2%, rgba(213,31,75,.055), transparent 58%),\n    var(--dm-bg);\n}\n\n.dm-wrap{max-width:1240px;margin:0 auto;padding:0 24px;}\n.dm-main{padding-top:0;padding-bottom:120px;}\n@media (max-width:820px){ .dm-wrap{padding:0 16px;} .dm-main{padding-bottom:150px;} }\n\n/* ---------------- NAVBAR ---------------- */\n.dm-header{\n  position:sticky;top:0;z-index:60;border-bottom:1px solid rgba(6,26,35,.07);\n  background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.6);\n  -webkit-backdrop-filter:blur(14px) saturate(1.6);color:var(--dm-text);\n}\n.dm-header-in{display:flex;align-items:center;gap:var(--dm-s5);\n  min-height:76px;padding:0 24px;flex-wrap:nowrap;}\n@media (max-width:820px){ .dm-header-in{min-height:64px;padding:0 16px;gap:var(--dm-s3);} }\n\n.dm-brand{display:flex;align-items:center;gap:var(--dm-s3);min-width:0;flex:none;}\n.dm-mark{width:46px;height:51px;border-radius:12px;object-fit:cover;background:#fff;flex:none;\n  padding:2px;box-shadow:var(--dm-shadow-sm),0 0 0 1px var(--dm-border);\n  cursor:pointer;transition:transform var(--dm-t);}\n.dm-mark:hover{transform:translateY(-1px) scale(1.03);}\n.dm-brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;\n  line-height:1.2;color:var(--dm-navy-950);}\n.dm-brand i{display:block;font-style:normal;font-size:11.5px;color:var(--dm-text-secondary);\n  letter-spacing:.01em;}\n@media (max-width:820px){ .dm-mark{width:40px;height:44px;} .dm-brand b{font-size:14.5px;} .dm-brand i{font-size:10.5px;} }\n\n.dm-navlink{display:flex;align-items:center;gap:2px;margin-left:auto;}\n.dm-navlink a{font-size:13.5px;font-weight:600;color:var(--dm-text-secondary);\n  text-decoration:none;padding:9px 13px;border-radius:var(--dm-radius-sm);\n  transition:color var(--dm-t),background var(--dm-t);white-space:nowrap;}\n.dm-navlink a:hover{color:var(--dm-teal-600);background:var(--dm-teal-100);}\n@media (max-width:1080px){ .dm-navlink{display:none;} }\n\n.dm-akreditasi{display:inline-flex;align-items:center;gap:9px;margin:0 0 0 12px;flex:none;\n  background:var(--dm-teal-100);border:1px solid rgba(8,127,131,.28);\n  border-radius:var(--dm-radius-sm);padding:6px 12px;color:var(--dm-teal-600);\n  white-space:nowrap;text-align:left;}\n.dm-lencana{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:7px;\n  background:linear-gradient(140deg,var(--dm-teal-500),var(--dm-teal-600));color:#fff;\n  font-weight:800;font-size:13.5px;line-height:1;}\n.dm-akre-teks{display:block;font-size:11.5px;font-weight:700;line-height:1.3;}\n.dm-akre-teks small{display:block;font-size:10px;font-weight:500;color:var(--dm-text-secondary);}\n@media (max-width:1080px){ .dm-akreditasi{margin-left:auto;} }\n@media (max-width:820px){ .dm-akre-teks small{display:none;} .dm-akre-teks{font-size:10.5px;} }\n@media (max-width: -s5);}\n@media (max-width:1080px){ .dm-kenapa-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }\n@media (max-width:600px){ .dm-kenapa-grid{grid-template-columns:1fr;gap:var(--dm-s4);} }\n.dm-kenapa-item b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.015em;\n  margin:13px 0 6px;}\n.dm-kenapa-item p{margin:0;font-size:13px;line-height:1.6;color:var(--dm-text-secondary);}\n.dm-kenapa-ikon{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;\n  font-size:20px;}\n.dm-ki-biru{background:#E8F1FE;}\n.dm-ki-hijau{background:#E6F6EE;}\n.dm-ki-ungu{background:#F0EBFC;}\n.dm-ki-jingga{background:#FDF0E4;}\n\n/* kartu bantuan */\n.dm-bantuan{background:linear-gradient(140deg,var(--dm-navy-950),var(--dm-navy-800));\n  color:#E9F4F3;border:1px solid rgba(126,231,214,.2);border-radius:var(--dm-radius-lg);\n  padding:var(--dm-s5);margin-bottom:var(--dm-s5);box-shadow:var(--dm-shadow-md);}\n.dm-bantuan-isi{display:flex;align-items:center;gap:13px;margin-bottom:var(--dm-s4);}\n.dm-bantuan-ikon{display:grid;place-items:center;width:44px;height:44px;flex:none;\n  border-radius:13px;background:rgba(126,231,214,.14);border:1px solid rgba(126,231,214,.3);\n  font-size:19px;}\n.dm-bantuan b{display:block;font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.015em;}\n.dm-bantuan p{margin:2px 0 0;font-size:12.8px;color:#9FC3C0;}\n@media (min-width:1081px){\n  .dm-bantuan{position:sticky;bottom:24px;max-width:340px;margin-left:auto;}\n}\n\n\n/* ============================================================\n   STRUKTUR SESUAI MOCKUP — navbar gelap, hero penuh lebar,\n   kolom kanan membentang\n   ============================================================ */\n\n/* --- NAVBAR GELAP --- */\n.dm-header{background:var(--dm-navy-950);color:#EAF4F3;\n  border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:none;-webkit-backdrop-filter:none;}\n.dm-header-in{min-height:74px;}\n.dm-brand b{color:#fff;}\n.dm-brand i{color:#8FB0AF;}\n.dm-mark{background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 6px 16px -8px rgba(0,0,0,.8);}\n\n.dm-navlink{gap:6px;margin:0 auto;}\n.dm-navlink a{position:relative;color:#C6DBD9;font-size:14px;font-weight:600;padding:10px 14px;\n  border-radius:0;}\n.dm-navlink a:hover{color:#fff;background:transparent;}\n.dm-navlink a::after{content:\"\";position:absolute;left:14px;right:14px;bottom:2px;height:2px;\n  border-radius:2px;background:linear-gradient(90deg,var(--dm-teal-500),var(--dm-red-600));\n  transform:scaleX(0);transform-origin:left;transition:transform var(--dm-t);}\n.dm-navlink a:hover::after{transform:scaleX(1);}\n\n.dm-akreditasi{margin:0 0 0 12px;background:rgba(255,255,255,.06);\n  border:1px solid rgba(255,255,255,.14);color:#DCEAE9;padding:8px 14px;\n  border-radius:var(--dm-radius-md);}\n.dm-akre-teks{color:#fff;font-size:12px;}\n.dm-akre-teks small{color:#8FB0AF;font-size:10.5px;}\n.dm-lencana{background:linear-gradient(140deg,#7EE7D6,var(--dm-teal-500));color:#062A29;\n  width:26px;height:26px;border-radius:8px;}\n\n/* --- HERO PENUH LEBAR --- */\n.dm-hero{border-radius:0;margin:0;box-shadow:none;\n  padding:clamp(34px,4.6vw,64px) 0 clamp(64px,6vw,96px);}\n.dm-hero-in{padding-left:24px;padding-right:24px;align-items:start;}\n@media (max-width:820px){\n  .dm-hero{padding:26px 0 58px;}\n  .dm-hero-in{padding-left:16px;padding-right:16px;}\n}\n.dm-hero h1{max-width:21ch;}\n.dm-hero h1 .dm-baris2{display:block;\n  background:linear-gradient(96deg,#7EE7D6 0%,#4FD8E8 60%,#8FD2FF 100%);\n  -webkit-background-clip:text;background-clip:text;color:transparent;}\n.dm-trust{display:flex;flex-wrap:wrap;gap:22px 30px;max-width:none;margin-top:var(--dm-s6);}\n.dm-trust li{flex-direction:row;align-items:center;gap:11px;font-size:13px;max-width:190px;}\n.dm-cek-kecil{width:34px;height:34px;border-radius:11px;font-size:15px;margin-top:0;\n  background:rgba(126,231,214,.1);border:1px solid rgba(126,231,214,.34);}\n@media (max-width:560px){ .dm-trust{gap:14px 18px;} .dm-trust li{max-width:none;width:100%;} }\n\n.dm-hero-kartu{background:rgba(9,38,48,.55);border:1px solid rgba(126,231,214,.18);\n  border-radius:var(--dm-radius-lg);box-shadow:0 20px 60px -26px rgba(0,0,0,.85);}\n.dm-hero-kartu h2{display:flex;align-items:flex-start;gap:12px;font-size:16px;\n  margin-bottom:var(--dm-s5);}\n.dm-hero-kartu h2::before{content:\"🎓\";display:grid;place-items:center;width:40px;height:40px;\n  flex:none;border-radius:13px;background:rgba(126,231,214,.14);\n  border:1px solid rgba(126,231,214,.3);font-size:18px;}\n\n/* --- GRID DUA KOLOM UTAMA --- */\n.dm-utama-grid{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:var(--dm-s5);\n  align-items:start;margin-top:clamp(-56px,-4vw,-40px);position:relative;z-index:5;}\n@media (max-width:1080px){\n  .dm-utama-grid{grid-template-columns:1fr;margin-top:-34px;}\n}\n.dm-kolom-kiri{min-width:0;}\n.dm-kolom-kanan{min-width:0;}\n.dm-kolom-kanan .dm-sisi{position:sticky;top:94px;display:flex;flex-direction:column;\n  gap:var(--dm-s4);}\n@media (max-width:1080px){ .dm-kolom-kanan .dm-sisi{position:static;} }\n.dm-bantuan{position:static !important;max-width:none !important;margin:0 !important;}\n.dm-main{padding-bottom:110px;}\n\n/* katalog & kartu di kolom yang lebih sempit */\n.dm-kelas-grid{grid-template-columns:repeat(auto-fit,minmax(238px,1fr));}\n@media (min-width:1500px){ .dm-kelas-grid{grid-template-columns:repeat(auto-fit,minmax(238px,1fr));} }\n.dm-kelas b{font-size:15.5px;}\n.dm-kelas i{font-size:12.5px;}\n.dm-kelas-harga{font-size:18px;}\n\n/* pencarian melayang di atas hero */\n.dm-cari{box-shadow:var(--dm-shadow-lg);}\n.dm-cari-baris{grid-template-columns:1.5fr repeat(4,minmax(0,1fr)) auto;}\n@media (max-width:1240px){ .dm-cari-baris{grid-template-columns:repeat(3,minmax(0,1fr));} }\n@media (max-width:820px){ .dm-cari-baris{grid-template-columns:repeat(2,minmax(0,1fr));} }\n@media (max-width:520px){ .dm-cari-baris{grid-template-columns:1fr;} }\n\n/* survei, karir, bar bawah tetap di dalam pembungkus lebar */\n.dm-survei,.dm-karir,.dm-kenapa{margin-bottom:var(--dm-s5);}\n\n\n/* ============================================================\n   HIERARKI WARNA IDENTITAS DEWA MEDIK NUSANTARA\n   Diambil dari logo resmi: navy, royal blue, putih, merah brand.\n   Teal disisakan khusus untuk garis EKG dan detail medis kecil.\n   ============================================================ */\n\n.dm-root{\n  /* navy — dari perisai logo */\n  --dm-navy-950:#0A1626; --dm-navy-900:#0F2237; --dm-navy-800:#16304C;\n  /* royal blue — dari tulisan \"Dewa Medik\" */\n  --dm-blue-700:#122764; --dm-blue-600:#183080; --dm-blue-500:#2141A6;\n  --dm-blue-400:#3D63D2; --dm-blue-100:#E7ECFA; --dm-blue-050:#F2F5FD;\n  /* merah brand — dari tulisan \"Nusantara\" */\n  --dm-red-700:#8E2114; --dm-red-600:#B32A19; --dm-red-500:#D13520;\n  --dm-red-100:#FBEAE6;\n  /* teal hanya untuk detail medis */\n  --dm-teal-600:#0E7C7B; --dm-teal-500:#12A3A0; --dm-teal-100:#E4F5F4;\n\n  --dm-bg:#F4F7FB; --dm-surface:#FFFFFF; --dm-surface-soft:#F7F9FD;\n  --dm-text:#101F33; --dm-text-secondary:#5E6E85; --dm-border:#DCE3EE;\n  --dm-success:#12734F; --dm-warning:#B4740A; --dm-danger:#B32A19;\n\n  /* token lama dipetakan ulang: aksi utama kini royal blue */\n  --ink:var(--dm-navy-950); --ink2:#233A55; --paper:var(--dm-bg);\n  --surface:var(--dm-surface); --line:var(--dm-border);\n  --teal:var(--dm-blue-500); --teal-d:var(--dm-blue-600);\n  --vital:var(--dm-red-600); --muted:var(--dm-text-secondary); --wait:var(--dm-warning);\n\n  background:\n    radial-gradient(900px 420px at 92% -6%, rgba(33,65,166,.10), transparent 60%),\n    radial-gradient(700px 340px at -4% 2%, rgba(179,42,25,.05), transparent 58%),\n    var(--dm-bg);\n}\n\n/* --- NAVBAR: navy dengan aksen merah --- */\n.dm-header{background:linear-gradient(100deg,var(--dm-navy-950) 0%,var(--dm-navy-900) 62%,var(--dm-blue-700) 100%);}\n.dm-navlink a{color:#C4D2E6;}\n.dm-navlink a::after{background:var(--dm-red-500);}\n.dm-akreditasi{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#DCE6F5;}\n.dm-akre-teks{color:#fff;}\n.dm-akre-teks small{color:#9DB0C9;}\n.dm-lencana{background:linear-gradient(140deg,var(--dm-blue-400),var(--dm-blue-600));color:#fff;}\n\n/* --- HERO: navy ke royal blue, aksen merah --- */\n.dm-hero{background:\n    radial-gradient(900px 460px at 80% 6%, rgba(33,65,166,.42), transparent 58%),\n    radial-gradient(620px 400px at 4% 96%, rgba(179,42,25,.24), transparent 60%),\n    linear-gradient(140deg,var(--dm-navy-950) 0%,var(--dm-navy-900) 46%,var(--dm-blue-700) 100%);}\n.dm-eyebrow{color:#EAB6AC;background:rgba(209,53,32,.16);border-color:rgba(209,53,32,.4);}\n.dm-eyebrow::before{background:var(--dm-red-500);box-shadow:0 0 0 4px rgba(209,53,32,.2);}\n.dm-hero-sub{color:#B9C9DE;}\n.dm-hero h1 .dm-baris2{background:linear-gradient(96deg,#6E92F0 0%,#96B4FF 55%,#D8E3FF 100%);\n  -webkit-background-clip:text;background-clip:text;color:transparent;}\n.dm-trust li{color:#CBD8E9;}\n.dm-cek-kecil{background:rgba(61,99,210,.16);border-color:rgba(120,158,255,.4);color:#9DB9FF;}\n.dm-hero-kartu{background:rgba(15,34,55,.6);border-color:rgba(120,158,255,.22);}\n.dm-hero-kartu h2::before{background:rgba(61,99,210,.18);border-color:rgba(120,158,255,.32);}\n.dm-langkah span{background:linear-gradient(140deg,var(--dm-blue-500),var(--dm-blue-700));}\n.dm-langkah i{color:#93A8C2;}\n\n/* --- ECG: teal tetap, ini detail medis --- */\n.dm-ecg-jalur{stroke:#1FBFB6;}\n.dm-ecg-tebal{stroke:#5FE3D6;filter:drop-shadow(0 0 5px rgba(95,227,214,.5));}\n.dm-denyut{fill:#8FF0E4;filter:drop-shadow(0 0 6px rgba(95,227,214,.85));}\n.dm-hero-ecg{opacity:.42;}\n@media (max-width:820px){ .dm-hero-ecg{opacity:.24;} }\n\n/* --- TOMBOL: royal blue utama, merah khusus aksi bertanda --- */\n.dm-btn{background:linear-gradient(150deg,var(--dm-blue-500),var(--dm-blue-700));\n  border-color:var(--dm-blue-700);box-shadow:0 4px 12px -6px rgba(24,48,128,.85);}\n.dm-btn:hover:not(:disabled){box-shadow:0 8px 20px -8px rgba(24,48,128,.9);}\n.dm-btn-navy{background:linear-gradient(150deg,var(--dm-navy-800),var(--dm-navy-950));\n  border-color:var(--dm-navy-950);}\n.dm-btn-aksen{background:linear-gradient(150deg,var(--dm-red-500),var(--dm-red-700));\n  border-color:var(--dm-red-700);box-shadow:0 4px 12px -6px rgba(142,33,20,.8);}\n.dm-btn-line:hover{border-color:var(--dm-blue-500);color:var(--dm-blue-600);\n  background:var(--dm-blue-050);}\n.dm-btn-ghost{color:var(--dm-blue-600);}\n.dm-btn-ghost:hover{border-bottom-color:var(--dm-blue-600);}\nbutton:focus-visible,a:focus-visible{outline-color:var(--dm-blue-500);}\n\n/* --- FORMULIR --- */\n.dm-input:focus,.dm-textarea:focus{border-color:var(--dm-blue-500);\n  box-shadow:0 0 0 3px rgba(33,65,166,.14);}\n.dm-nomor{background:linear-gradient(140deg,var(--dm-blue-500),var(--dm-blue-700));\n  box-shadow:0 4px 10px -4px rgba(24,48,128,.7);}\n.dm-kelompok-judul{color:var(--dm-blue-600);}\n.dm-req{color:var(--dm-red-600);background:var(--dm-red-100);}\n\n/* --- KARTU KELAS --- */\n.dm-kelas:hover:not(.dm-kelas-off){border-color:rgba(33,65,166,.4);}\n.dm-kelas-on{border-color:var(--dm-blue-500);background:var(--dm-blue-050);\n  box-shadow:0 0 0 3px rgba(33,65,166,.14),var(--dm-shadow-md);}\n.dm-terpilih{background:var(--dm-blue-600);box-shadow:0 4px 12px -4px rgba(24,48,128,.85);}\n.dm-kelas-harga{color:var(--dm-navy-900);}\n.dm-katalog-ikon{background:var(--dm-blue-100);color:var(--dm-blue-600);}\n.dm-opsi:hover{border-color:var(--dm-blue-500);}\n.dm-opsi-on{border-color:var(--dm-blue-500);background:var(--dm-blue-050);\n  box-shadow:0 0 0 3px rgba(33,65,166,.13);}\n.dm-opsi u{color:var(--dm-blue-600);}\n\n/* --- KUOTA: hijau/kuning/merah tetap, ini penanda status --- */\n.dm-bar-habis{background:linear-gradient(90deg,#D0503C,var(--dm-red-600));}\n\n/* --- UNGGAH --- */\n.dm-unggah-tombol:hover{border-color:var(--dm-blue-500);background:var(--dm-blue-050);}\n.dm-kamera{background:linear-gradient(140deg,var(--dm-navy-800),var(--dm-navy-950));color:#9DB9FF;}\n.dm-unggah-nada .dm-unggah-tombol{border-color:rgba(179,42,25,.3);background:#FEF7F5;}\n.dm-unggah-nada .dm-unggah-tombol:hover{border-color:var(--dm-red-600);background:var(--dm-red-100);}\n.dm-unggah-nada .dm-kamera{background:linear-gradient(140deg,var(--dm-red-500),var(--dm-red-700));color:#fff;}\n.dm-unggah-hasil{border-color:var(--dm-blue-500);background:var(--dm-blue-050);}\n.dm-unggah-hasil b{color:var(--dm-blue-600);}\n.dm-unggah-hasil b::before{background:var(--dm-blue-600);}\n\n/* --- RINGKASAN --- */\n.dm-ringkas-kepala{background:linear-gradient(140deg,var(--dm-navy-950),var(--dm-blue-700));}\n.dm-ringkas-kepala::before{background:rgba(120,158,255,.16);border-color:rgba(120,158,255,.3);}\n.dm-ringkas-kosong span{background:var(--dm-blue-100);color:var(--dm-blue-600);}\n.dm-baris-diskon b{color:var(--dm-red-600);}\n.dm-baris-total b{color:var(--dm-navy-900);}\n.dm-cek-voucher{color:var(--dm-blue-600);}\n.dm-putar-kecil{border-color:rgba(33,65,166,.25);border-top-color:var(--dm-blue-600);}\n.dm-detail-harga{color:var(--dm-blue-600) !important;}\n\n/* --- KOTAK INFORMASI --- */\n.dm-rek{background:linear-gradient(140deg,var(--dm-navy-950),var(--dm-blue-700));\n  border-color:rgba(120,158,255,.22);}\n.dm-rek span{color:#9DB0C9;}\n.dm-catatan{background:var(--dm-red-100);border-color:rgba(179,42,25,.28);\n  border-left-color:var(--dm-red-600);color:var(--dm-red-700);}\n.dm-bar{background:linear-gradient(140deg,var(--dm-navy-950),var(--dm-blue-700));\n  border-color:rgba(120,158,255,.2);}\n.dm-bar-diskon{color:#9DB9FF;}\n.dm-bar-sepi{color:#93A8C2;}\n.dm-bantuan{background:linear-gradient(140deg,var(--dm-navy-950),var(--dm-blue-700));\n  border-color:rgba(120,158,255,.2);}\n.dm-bantuan-ikon{background:rgba(120,158,255,.14);border-color:rgba(120,158,255,.3);}\n.dm-bantuan p{color:#9DB0C9;}\n\n/* --- KENAPA MEMILIH --- */\n.dm-ki-biru{background:var(--dm-blue-100);}\n.dm-ki-hijau{background:#E4F3EC;}\n.dm-ki-ungu{background:#EDEAFA;}\n.dm-ki-jingga{background:var(--dm-red-100);}\n\n/* --- SURVEI & KARIR --- */\n.dm-survei{background:\n    radial-gradient(700px 340px at 84% 4%, rgba(33,65,166,.34), transparent 60%),\n    linear-gradient(150deg,var(--dm-navy-950),var(--dm-blue-700));\n  border-color:rgba(120,158,255,.2);}\n.dm-angka b{color:#9DB9FF;}\n.dm-angka-sorot{background:rgba(61,99,210,.14);border-color:rgba(120,158,255,.42);}\n.dm-testi-judul{color:#9DB9FF;}\n.dm-karir-tanda{color:var(--dm-red-600);border-color:var(--dm-red-600);}\n.dm-lowongan{border-left-color:var(--dm-blue-500);}\n.dm-lowongan-tipe{color:var(--dm-blue-600);background:var(--dm-blue-100);\n  border-color:rgba(33,65,166,.3);}\n\n/* --- FOOTER & LAIN-LAIN --- */\n.dm-footer{background:linear-gradient(140deg,var(--dm-navy-950),var(--dm-blue-700));}\n.dm-situs{border-bottom-color:var(--dm-red-500);}\n.dm-handle{color:#E8A99E;}\n.dm-cek{background:var(--dm-blue-100);color:var(--dm-blue-600);}\n.dm-vital{color:var(--dm-red-600);}\n.dm-garis{background:linear-gradient(90deg,var(--dm-red-600) 0%,var(--dm-blue-500) 42%,rgba(33,65,166,0) 100%);}\n.dm-tagline{background:linear-gradient(97deg,var(--dm-navy-950) 0%,var(--dm-blue-600) 46%,\n  var(--dm-blue-400) 74%,var(--dm-red-600) 100%);\n  -webkit-background-clip:text;background-clip:text;color:transparent;}\n.dm-jenis{background:var(--dm-navy-900);}\n.dm-badge-ok{color:var(--dm-blue-600);border-color:var(--dm-blue-500);background:var(--dm-blue-050);}\n.dm-kosong-besar span{background:var(--dm-blue-100);color:var(--dm-blue-600);}\n.dm-rangka::after{background:linear-gradient(90deg,transparent,rgba(33,65,166,.06),transparent);}\n.dm-subtab .dm-tab-on{background:var(--dm-blue-600);border-color:var(--dm-blue-600);}\n.dm-chip-on{background:var(--dm-blue-600);border-color:var(--dm-blue-600);}\n.dm-kabari{border-color:var(--dm-blue-500);background:var(--dm-blue-050);}\n.dm-kabari b{color:var(--dm-blue-600);}\n\n\n/* ============================================================\n   FINAL PREMIUM POLISH\n   Hanya penghalusan visual. Tata letak dan logika tidak berubah.\n   ============================================================ */\n\n/* --- 1. HERO LEBIH RINGKAS (-18% tinggi) --- */\n.dm-hero{padding:clamp(26px,3.5vw,50px) 0 clamp(50px,4.6vw,74px);}\n.dm-hero-in{gap:clamp(22px,2.6vw,40px);}\n.dm-eyebrow{margin-bottom:var(--dm-s3);padding:5px 13px;font-size:10.5px;}\n.dm-hero h1{font-size:clamp(27px,3.7vw,46px);line-height:1.1;margin-bottom:var(--dm-s3);}\n.dm-hero-sub{margin-bottom:var(--dm-s5);font-size:clamp(14px,1.1vw,16px);}\n.dm-trust{margin-top:var(--dm-s5);gap:16px 26px;}\n.dm-cek-kecil{width:31px;height:31px;border-radius:10px;}\n.dm-hero-kartu{padding:var(--dm-s5);}\n.dm-hero-kartu h2{margin-bottom:var(--dm-s4);font-size:15.5px;}\n.dm-hero-kartu h2::before{width:36px;height:36px;border-radius:11px;}\n.dm-langkah{padding:9px 0;gap:12px;}\n.dm-langkah span{width:28px;height:28px;border-radius:9px;font-size:13px;}\n.dm-langkah b{font-size:13.5px;}\n.dm-langkah i{font-size:11.8px;}\n@media (max-width:820px){ .dm-hero{padding:20px 0 46px;} }\n\n/* --- 2. WARNA HEADLINE: royal blue elegan --- */\n.dm-hero h1 .dm-baris2{\n  background:linear-gradient(96deg,#4F74D9 0%,#6D8FE8 58%,#9FB8F2 100%);\n  -webkit-background-clip:text;background-clip:text;color:transparent;}\n\n/* --- 3. ECG LEBIH HALUS (-30% opacity, garis lebih tipis) --- */\n.dm-hero-ecg{opacity:.29;height:min(40%,190px);}\n.dm-ecg-jalur{stroke-width:1.25;}\n.dm-ecg-tebal{stroke-width:1.5;filter:drop-shadow(0 0 4px rgba(95,227,214,.32));}\n.dm-ecg-tipis{opacity:.22;stroke-width:1;}\n.dm-denyut{filter:drop-shadow(0 0 4px rgba(95,227,214,.6));}\n@keyframes dm-denyut{0%,100%{opacity:.18;r:2.2;}12%{opacity:.8;r:3.4;}30%{opacity:.26;r:2.6;}}\n@media (max-width:820px){ .dm-hero-ecg{opacity:.17;} }\n\n/* --- 4. IKON SERAGAM --- */\n.dm-svg{flex:none;display:block;}\n.dm-ikon{color:var(--dm-text-secondary);opacity:.78;width:15px;height:15px;margin-top:1px;}\n.dm-svg-samar{color:var(--dm-text eft:11px;}\n.dm-kenapa h2::before{content:\"\";position:absolute;left:0;top:.2em;bottom:.2em;width:3px;\n  border-radius:2px;background:var(--dm-red-600);}\n.dm-req{background:var(--dm-red-100);color:var(--dm-red-700);}\n\n/* --- 8. TOOLBAR PENCARIAN TERPADU --- */\n.dm-cari{padding:16px 18px;border-radius:var(--dm-radius-lg);\n  box-shadow:0 6px 22px -14px rgba(16,31,51,.3),0 1px 2px rgba(16,31,51,.04);}\n.dm-cari-baris{gap:10px;}\n.dm-cari .dm-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--dm-text-secondary);margin-bottom:5px;}\n.dm-cari .dm-input{min-height:44px;padding:10px 13px;font-size:14px;}\n.dm-cari select.dm-input{padding-right:32px;\n  background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;}\n.dm-cari-tombol{height:44px;min-height:44px;font-size:14px;padding:0 18px;}\n.dm-cari-kaki{margin-top:13px;padding-top:11px;font-size:12.5px;}\n\n/* --- 9 & 10. RINGKASAN & KARTU BANTUAN --- */\n.dm-ringkas-kepala{padding:15px 18px;}\n.dm-ringkas-isi{padding:18px;}\n.dm-baris{padding:6px 0;font-size:13.2px;}\n.dm-baris-total b{font-size:22px;}\n.dm-bantuan{padding:16px;border-radius:var(--dm-radius-md);}\n.dm-bantuan-isi{gap:11px;margin-bottom:13px;}\n.dm-bantuan-ikon{width:38px;height:38px;border-radius:11px;}\n.dm-bantuan b{font-size:14.5px;}\n.dm-bantuan p{font-size:12.2px;}\n.dm-bantuan .dm-btn{min-height:42px;font-size:14px;\n  background:linear-gradient(150deg,var(--dm-blue-500),var(--dm-blue-700));\n  border-color:var(--dm-blue-700);box-shadow:none;}\n\n/* --- 11. BAYANGAN & GARIS LEBIH RINGAN --- */\n.dm-shadow-reset{}\n.dm-card,.dm-katalog,.dm-kenapa{box-shadow:0 1px 2px rgba(16,31,51,.04);}\n.dm-kelas{box-shadow:0 1px 2px rgba(16,31,51,.045);}\n.dm-kelas:hover:not(.dm-kelas-off){box-shadow:0 10px 26px -18px rgba(16,31,51,.45);}\n.dm-kelas-on{box-shadow:0 0 0 2px rgba(33,65,166,.16),0 6px 18px -14px rgba(16,31,51,.4);}\n.dm-ringkas{box-shadow:0 6px 24px -18px rgba(16,31,51,.4);}\n.dm-hero{box-shadow:none;}\n.dm-modal{box-shadow:0 24px 60px -20px rgba(16,31,51,.45);}\n.dm-unggah-tombol{border-width:1.4px;}\n.dm-opsi{border-width:1.4px;}\n\n/* --- 12. TIPOGRAFI SATU SISTEM --- */\n.dm-root{font-size:15px;}\n.dm-card h3{font-size:16.5px;font-weight:700;margin-bottom:18px;}\n.dm-katalog-kepala h2{font-size:18px;font-weight:700;}\n.dm-katalog-kepala p{font-size:12.5px;font-weight:400;}\n.dm-kelompok-judul{font-size:11px;font-weight:700;}\n.dm-label{font-size:12.5px;font-weight:600;}\n.dm-hint{font-size:11.8px;font-weight:400;}\n.dm-kenapa h2{font-size:clamp(18px,2vw,23px);font-weight:700;}\n.dm-kenapa-item b{font-size:14px;font-weight:700;}\n.dm-kenapa-item p{font-size:12.5px;font-weight:400;}\n.dm-ringkas-kepala h3{font-size:15.5px;font-weight:700;}\n.dm-detail-list b{font-weight:600;}\n.dm-mono{font-weight:400;}\n.dm-baris b,.dm-kelas-harga,.dm-baris-total b,.dm-bar-in b{font-weight:800;}\n\n/* --- 13 & 14. KESEIMBANGAN LAYAR --- */\n.dm-utama-grid{margin-top:clamp(-44px,-3vw,-32px);gap:18px;}\n.dm-kelas-grid{gap:14px;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));}\n.dm-katalog{padding:20px;}\n.dm-kenapa{padding:26px 22px;}\n.dm-kenapa-grid{gap:20px;}\n@media (max-width:1080px){ .dm-utama-grid{margin-top:-28px;} }\n@media (max-width:560px){\n  .dm-hero h1{font-size:26px;}\n  .dm-hero-sub{font-size:13.8px;}\n  .dm-katalog{padding:16px 14px;}\n  .dm-kelas-grid{gap:12px;}\n  .dm-cari{padding:14px;}\n  .dm-bar-in{padding:12px 15px 14px;}\n}\n\n\n/* --- Kartu status pada Cek Pendaftaran --- */\n.dm-status{display:flex;gap:14px;align-items:flex-start;padding:16px;margin-bottom:var(--dm-s4);\n  border-radius:var(--dm-radius-md);border:1px solid;}\n.dm-status-tanda{display:grid;place-items:center;width:42px;height:42px;flex:none;\n  border-radius:13px;background:rgba(255,255,255,.7);}\n.dm-status b{display:block;font-size:15.5px;font-weight:700;}\n.dm-status p{margin:4px 0 0;font-size:13px;line-height:1.55;}\n.dm-status-menunggu{background:#FFF8EC;border-color:rgba(180,116,10,.32);color:#7A4F08;}\n.dm-status-terverifikasi{background:#E9F6F0;border-color:rgba(18,115,79,.32);color:#0E5B3F;}\n.dm-status-ditolak{background:var(--dm-red-100);border-color:rgba(179,42,25,.3);color:var(--dm-red-700);}\n.dm-status-menunggu .dm-status-tanda{color:var(--dm-warning);}\n.dm-status-terverifikasi .dm-status-tanda{color:var(--dm-success);}\n.dm-status-ditolak .dm-status-tanda{color:var(--dm-red-600);}\n\n\n/* --- Galeri fasilitas & peralatan praktik --- */\n.dm-fasilitas{background:var(--dm-surface);border:1px solid var(--dm-border);\n  border-radius:var(--dm-radius-xl);padding:26px 22px;margin-bottom:var(--dm-s5);\n  box-shadow:0 1px 2px rgba(16,31,51,.04);}\n.dm-fasilitas h2{position:relative;padding-left:11px;font-size:clamp(18px,2vw,23px);\n  font-weight:700;letter-spacing:-.025em;margin:0 0 20px;line-height:1.25;}\n.dm-fasilitas h2::before{content:\"\";position:absolute;left:0;top:.2em;bottom:.2em;width:3px;\n  border-radius:2px;background:var(--dm-red-600);}\n.dm-fasilitas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;}\n.dm-fasilitas-item{margin:0;border:1px solid var(--dm-border);border-radius:var(--dm-radius-md);\n  overflow:hidden;background:var(--dm-surface-soft);\n  transition:transform var(--dm-t),box-shadow var(--dm-t);}\n.dm-fasilitas-item:hover{transform:translateY(-2px);box-shadow:0 10px 24px -18px rgba(16,31,51,.45);}\n.dm-fasilitas-item img{display:block;width:100%;height:126px;object-fit:cover;background:#E9EEF6;}\n.dm-fasilitas-kosong{display:grid;place-items:center;height:126px;background:var(--dm-blue-050);\n  color:var(--dm-blue-500);}\n.dm-fasilitas-item figcaption{padding:11px 13px 13px;}\n.dm-fasilitas-item b{display:block;font-size:12.8px;font-weight:700;line-height:1.35;}\n.dm-fasilitas-item i{display:block;font-style:normal;font-size:11.5px;line-height:1.45;\n  color:var(--dm-text-secondary);margin-top:3px;}\n@media (max-width:560px){\n  .dm-fasilitas{padding:20px (to bottom,rgba(0,0,0,.35),#000 60%);\n    mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),#000 60%);}\n  .dm-hero-tirai{background:linear-gradient(to bottom,rgba(10,22,38,.82),rgba(10,22,38,.9));}\n}\n@media (max-width:820px){ .dm-hero-foto{opacity:.22;} }\n\n.dm-hero-foto{opacity:.42;filter:saturate(.8) brightness(.92);background-position:center 46%;}\n.dm-hero-tirai{background:\n    linear-gradient(97deg,var(--dm-navy-950) 24%,rgba(10,22,38,.9) 46%,rgba(10,22,38,.5) 70%,rgba(10,22,38,.6) 100%),\n    linear-gradient(to bottom,rgba(10,22,38,.4),transparent 32%,rgba(10,22,38,.6));}\n@media (max-width:960px){ .dm-hero-foto{opacity:.26;} }\n@media (max-width:820px){ .dm-hero-foto{opacity:.19;} }\n\n/* Foto ACLS: banyak merah seragam, jadi kejenuhan warna diturunkan\n   agar tidak bertabrakan dengan merah brand, dan tirai dipekatkan. */\n.dm-hero-foto{opacity:.4;filter:saturate(.62) brightness(.86);background-position:center 48%;}\n.dm-hero-tirai{background:\n    linear-gradient(97deg,var(--dm-navy-950) 26%,rgba(10,22,38,.93) 48%,rgba(10,22,38,.56) 72%,rgba(10,22,38,.66) 100%),\n    linear-gradient(to bottom,rgba(10,22,38,.42),transparent 30%,rgba(10,22,38,.62));}\n@media (max-width:960px){ .dm-hero-foto{opacity:.24;} }\n@media (max-width:820px){ .dm-hero-foto{opacity:.17;} }\n\n\n/* ============================================================\n   INVOICE / FAKTUR TAGIHAN\n   Ukuran mengikuti kertas A4 dengan huruf serif seperti berkas asli.\n   ============================================================ */\n.dm-inv-layar{position:fixed;inset:0;z-index:200;background:#5A6472;overflow:auto;padding:0 0 40px;}\n.dm-inv-alat{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;\n  align-items:center;gap:16px;flex-wrap:wrap;background:var(--dm-navy-950);color:#fff;\n  padding:14px 20px;box-shadow:0 4px 18px rgba(0,0,0,.35);}\n.dm-inv-alat b{font-size:15px;}\n.dm-inv-alat .dm-hint{color:#9DB0C9;margin:3px 0 0;max-width:60ch;}\n.dm-inv-alat .dm-hint b{font-size:inherit;color:#fff;}\n.dm-inv-kertas{margin:24px auto;width:210mm;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4);}\n@media (max-width:820px){\n  .dm-inv-kertas{width:100%;transform-origin:top left;}\n  .dm-inv-alat{padding:12px 14px;}\n}\n\n.dm-invoice{width:210mm;min-height:297mm;padding:14mm 16mm;background:#fff;color:#000;\n  font-family:\"Times New Roman\",Times,serif;font-size:11pt;line-height:1.42;box-sizing:border-box;}\n.dm-invoice p{margin:0 0 7pt;}\n\n.dm-inv-kop{display:flex;align-items:flex-start;gap:8pt;}\n.dm-inv-logo{width:52pt;height:58pt;object-fit:contain;flex:none;}\n.dm-inv-kop-teks{flex:1;text-align:center;}\n.dm-inv-kop-teks h1{font-size:15pt;font-weight:bold;margin:0 0 1pt;letter-spacing:.3pt;}\n.dm-inv-kop-teks p{margin:0;font-size:10.5pt;line-height:1.3;}\n.dm-inv-akre{flex:none;width:120pt;text-align:right;}\n.dm-inv-akre b{display:block;font-size:6.6pt;line-height:1.28;color:#1a3a7a;}\n.dm-inv-garis{border-bottom:2.4pt solid #000;margin:4pt 0 12pt;}\n\n.dm-inv-judul{text-align:center;font-size:13.5pt;font-weight:bold;color:#1a3a7a;margin:0 0 2pt;\n  letter-spacing:.2pt;}\n.dm-inv-subjudul{text-align:center;font-style:italic;font-size:10.5pt;margin:0 0 12pt;}\n\n.dm-inv-meta{width:100%;border-collapse:collapse;margin-bottom:10pt;}\n.dm-inv-meta td{padding:1.5pt 0;vertical-align:top;font-size:11pt;}\n.dm-inv-label{width:70pt;}\n.dm-inv-titik{width:12pt;}\n.dm-inv-kota{text-align:right;white-space:nowrap;}\n.dm-inv-kepada{margin-bottom:10pt;}\n.dm-inv-paragraf{text-align:justify;}\n\n.dm-inv-tabel{width:100%;border-collapse:collapse;margin:8pt 0 10pt;font-size:10.5pt;}\n.dm-inv-tabel th,.dm-inv-tabel td{border:.8pt solid #000;padding:5pt 7pt;vertical-align:middle;}\n.dm-inv-tabel th{background:#dbe5f1;font-weight:bold;text-align:center;}\n.dm-inv-tengah{text-align:center;}\n.dm-inv-total td{background:#dbe5f1;}\n.dm-inv-terbilang{margin-bottom:9pt;}\n\n.dm-inv-bank{border-collapse:collapse;margin:6pt 0 10pt 18pt;}\n.dm-inv-bank td{padding:2pt 0;font-size:11pt;}\n.dm-inv-bank .dm-inv-label{width:88pt;}\n\n.dm-inv-ttd{display:flex;justify-content:flex-end;margin-top:10pt;}\n.dm-inv-ttd img{width:150pt;height:auto;}\n\n/* baris pengisian rincian di back office */\n.dm-inv-baris-isi{display:grid;grid-template-columns:1fr 88px 148px auto;gap:8px;\n  align-items:center;margin-bottom:9px;}\n@media (max-width:700px){ .dm-inv-baris-isi{grid-template-columns:1fr;} }\n\n/* Saat dicetak, hanya lembar invoice yang keluar. */\n@media print{\n  @page{size:A4;margin:0;}\n  body{background:#fff;}\n  .dm-root > *:not(.dm-inv-layar){display:none !important;}\n  .dm-inv-layar{position:static;background:#fff;padding:0;overflow:visible;}\n  .dm-inv-alat{display:none !important;}\n  .dm-inv-kertas{margin:0;width:auto;box-shadow:none;}\n  .dm-invoice{width:auto;min-height:auto;padding:12mm 15mm;}\n  .dm-modal-bg,.dm-toast,.dm-header,.dm-footer,.dm-bar{display:none !important;}\n}\n\n/* --- Permintaan invoice --- */\n.dm-inv-minta{background:var(--dm-blue-050);border:1px solid rgba(33,65,166,.2);\n  border-radius:var(--dm-radius-md);padding:15px 15px 6px;margin-bottom:var(--dm-s4);}\n.dm-inv-minta .dm-hint{margin-top:2px;}\n.dm-tanda-invoice{display:inline-block;margin-left:7px;font-size:10px;font-weight:700;\n  letter-spacing:.05em;text-transform:uppercase;color:var(--dm-blue-600);\n  background:var(--dm-blue-100);border-radius:5px;padding:2px 7px;vertical-align:middle;}\n\n";
/* ============================================================

   Terhubung ke Supabase. LOGO_DMN dan CSS disisipkan saat build.

/* Membetulkan bentuk alamat yang sering salah tersalin. */
function bersihkanUrl(u) {
  let x = String(u || "").trim().replace(/\/+$/, "");
  const dash = x.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if (dash) return "https://" + dash[1] + ".supabase.co";
  x = x.replace(/\/(rest|auth|storage|realtime)(\/.*)?$/i, "");
  if (x && !/^https?:\/\//i.test(x)) x = "https://" + x;
  return x;
}
const SB = supabase.createClient(bersihkanUrl(window.DMN_CONFIG.url), String(window.DMN_CONFIG.anonKey || "").trim());

/* ============================================================
   Link khusus per kampanye.

   Alamat seperti  ...?k=solo-september  membuka halaman yang
   sama persis, tetapi hanya menampilkan kelas yang dipilih
   pengurus untuk kampanye itu. Gerbang biaya dan alur
   pendaftaran tidak berubah sedikit pun.
   ============================================================ */
window.DM_SLUG = (function () {
  try {
    var v = new URLSearchParams(window.location.search).get("k") || "";
    v = String(v).trim().toLowerCase();
    return /^[a-z0-9][a-z0-9-]{0,58}[a-z0-9]$/.test(v) ? v : null;
  } catch (e) {
    return null;
  }
})();

/* ============================================================

/* ============================================================
   Gerbang biaya.

   Biaya pelatihan tidak ikut dikirim ke halaman. Pengunjung
   membukanya dengan meninggalkan nama dan nomor WhatsApp, lalu
   server mengembalikan daftar biayanya. Datanya juga tersimpan
   sebagai calon peserta, jadi yang benar-benar berminat tercatat.

   Ditulis tanpa React supaya tidak menyentuh alur halaman.
   ============================================================ */
(function () {
  var KUNCI = "dm-biaya-sesi";
  try {
    var simpan = sessionStorage.getItem(KUNCI);
    if (simpan) window.DM_BIAYA = JSON.parse(simpan);
  } catch (e) {}

  var sedang = false;

  function gaya() {
    if (document.getElementById("dm-gaya-biaya")) return;
    var g = document.createElement("style");
    g.id = "dm-gaya-biaya";
    g.textContent = [
      ".dm-buka-biaya{display:inline-block;margin-top:2px;padding:6px 13px;border-radius:9px;",
      "  border:1px solid rgba(24,48,128,.28);background:#eef3fd;color:#1b3a86;",
      "  font:600 13.5px/1.2 inherit;cursor:pointer;letter-spacing:-.01em;}",
      ".dm-buka-biaya:hover{background:#e2ebfb;}",
      ".dm-gb-tirai{position:fixed;inset:0;z-index:9999;background:rgba(10,18,38,.55);",
      "  display:flex;align-items:center;justify-content:center;padding:20px;}",
      ".dm-gb-kotak{background:#fff;border-radius:16px;max-width:420px;width:100%;",
      "  padding:26px 24px;box-shadow:0 24px 60px rgba(10,18,38,.3);",
      "  font:14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;color:#16202e;}",
      ".dm-gb-kotak h3{margin:0 0 6px;font-size:17px;}",
      ".dm-gb-kotak p.ket{margin:0 0 18px;font-size:13.5px;color:#5b6577;}",
      ".dm-gb-kotak label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;}",
      ".dm-gb-kotak input{width:100%;box-sizing:border-box;padding:9px 11px;font:inherit;",
      "  border:1px solid #dfe5ee;border-radius:9px;}",
      ".dm-gb-kotak input:focus{outline:2px solid #e5edfb;border-color:#2a56c6;}",
      ".dm-gb-galat{margin:12px 0 0;color:#a3271f;font-size:13px;}",
      ".dm-gb-aksi{display:flex;gap:9px;margin-top:20px;}",
      ".dm-gb-aksi button{flex:1;padding:10px;border-radius:10px;font:600 14px inherit;cursor:pointer;}",
      ".dm-gb-batal{background:#fff;border:1px solid #dfe5ee;color:#16202e;}",
      ".dm-gb-kirim{background:#16357e;border:1px solid #16357e;color:#fff;}",
      ".dm-gb-kirim:disabled{opacity:.6;cursor:default;}"
    ].join("\n");
    document.head.appendChild(g);
  }

  window.dmMintaBiaya = function () {
    if (sedang) return;
    sedang = true;
    gaya();

    var tirai = document.createElement("div");
    tirai.className = "dm-gb-tirai";
    tirai.innerHTML =
      '<div class="dm-gb-kotak" role="dialog" aria-modal="true">' +
      "<h3>Lihat biaya pelatihan</h3>" +
      '<p class="ket">Isi nama, nomor WhatsApp, dan email Anda. Biaya seluruh kelas langsung ' +
      "tampil, dan tim kami dapat membantu bila Anda butuh penjelasan.</p>" +
      '<label for="dm-gb-nama">Nama lengkap</label>' +
      '<input id="dm-gb-nama" type="text" autocomplete="name">' +
      '<label for="dm-gb-wa">Nomor WhatsApp</label>' +
      '<input id="dm-gb-wa" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08xxxxxxxxxx">' +
      '<label for="dm-gb-surel">Email</label>' +
      '<input id="dm-gb-surel" type="email" autocomplete="email" placeholder="nama@contoh.com">' +
      '<p class="dm-gb-galat" hidden></p>' +
      '<div class="dm-gb-aksi">' +
      '<button type="button" class="dm-gb-batal">Batal</button>' +
      '<button type="button" class="dm-gb-kirim">Tampilkan biaya</button>' +
      "</div></div>";
    document.body.appendChild(tirai);

    var nama = tirai.querySelector("#dm-gb-nama");
    var wa = tirai.querySelector("#dm-gb-wa");
    var surel = tirai.querySelector("#dm-gb-surel");
    var galat = tirai.querySelector(".dm-gb-galat");
    var kirim = tirai.querySelector(".dm-gb-kirim");
    setTimeout(function () { nama.focus(); }, 50);

    function tutup() {
      sedang = false;
      if (tirai.parentNode) tirai.parentNode.removeChild(tirai);
    }
    tirai.querySelector(".dm-gb-batal").onclick = tutup;
    tirai.onclick = function (e) { if (e.target === tirai) tutup(); };

    kirim.onclick = async function () {
      galat.hidden = true;
      var n = (nama.value || "").trim();
      var w = (wa.value || "").replace(/[^0-9]/g, "");
      if (n.length < 3) { galat.textContent = "Nama belum lengkap."; galat.hidden = false; return; }
      var wn = w;
      if (wn.slice(0, 2) === "62") { /* sudah bentuk 62 */ }
      else if (wn.charAt(0) === "0") wn = "62" + wn.slice(1);
      else if (wn.charAt(0) === "8") wn = "62" + wn;
      if (!/^628[0-9]{7,11}$/.test(wn)) {
        galat.textContent = "Masukkan nomor WhatsApp Indonesia, contoh 081234567890.";
        galat.hidden = false; return;
      }
      var em = (surel.value || "").trim().toLowerCase();
      var polaSurel = /^[a-z0-9]([a-z0-9._%+-]{0,62}[a-z0-9])?@([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}$/;
      if (!polaSurel.test(em) || em.indexOf("..") > -1) {
        galat.textContent = "Alamat email tidak wajar. Contoh yang benar: nama@gmail.com";
        galat.hidden = false; return;
      }
      kirim.disabled = true;
      kirim.textContent = "Mohon tunggu…";
      try {
        /* Periksa apakah domain emailnya sungguh ada dan siap menerima surat.
           Kalau pemeriksaannya sendiri gagal (jaringan), jangan hambat orang. */
        kirim.textContent = "Memeriksa email…";
        var domain = em.split("@")[1];
        var domainAda = true;
        try {
          var tanya = async function (jenis) {
            var jw = await fetch("https://dns.google/resolve?name=" +
              encodeURIComponent(domain) + "&type=" + jenis);
            if (!jw.ok) return null;
            var isi = await jw.json();
            return Array.isArray(isi.Answer) ? isi.Answer : [];
          };
          var mx = await tanya("MX");
          if (mx !== null) {
            domainAda = mx.some(function (x) { return x.type === 15; });
            if (!domainAda) {
              var aa = await tanya("A");
              domainAda = aa !== null && aa.length > 0;
            }
          }
        } catch (e) { domainAda = true; }
        if (!domainAda) {
          throw new Error("Domain \"" + domain + "\" tidak ditemukan. Periksa lagi alamat email Anda.");
        }
        kirim.textContent = "Mohon tunggu…";
        var hasil = await SB.rpc("lihat_biaya", { p_nama: n, p_wa: w, p_email: em });
        if (hasil.error) throw new Error(hasil.error.message);
        var peta = {};
        (hasil.data || []).forEach(function (x) { peta[x.id] = Number(x.harga); });
        window.DM_BIAYA = peta;
        try { sessionStorage.setItem(KUNCI, JSON.stringify(peta)); } catch (e) {}
        if (window.dmCatatAsal) { try { await window.dmCatatAsal(null, wn); } catch (e) {} }
        location.reload();
      } catch (e) {
        galat.textContent = /tidak ditemukan|tidak wajar|belum benar|belum diisi|benar-benar Anda pakai/.test(e.message)
          ? e.message
          : "Gagal menampilkan biaya: " + e.message;
        galat.hidden = false;
        kirim.disabled = false;
        kirim.textContent = "Tampilkan biaya";
      }
    };

    [nama, wa, surel].forEach(function (el) {
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") kirim.onclick(); });
    });
  };

  /* Gayanya dipasang sejak halaman dibuka, bukan menunggu kotaknya
     muncul — kalau tidak, tombol "Lihat biaya" di kartu kelas tampil
     polos seperti tombol bawaan browser. */
  if (document.head) gaya();
  else document.addEventListener("DOMContentLoaded", gaya);
})();

/* Angka menjadi kata, untuk baris "Terbilang". */
function terbilang(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  const satuan = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
  function ubah(x) {
    if (x < 12) return satuan[x];
    if (x < 20) return ubah(x - 10) + " belas";
    if (x < 100) return ubah(Math.floor(x / 10)) + " puluh" + (x % 10 ? " " + ubah(x % 10) : "");
    if (x < 200) return "seratus" + (x % 100 ? " " + ubah(x % 100) : "");
    if (x < 1000) return ubah(Math.floor(x / 100)) + " ratus" + (x % 100 ? " " + ubah(x % 100) : "");
    if (x < 2000) return "seribu" + (x % 1000 ? " " + ubah(x % 1000) : "");
    if (x < 1000000) return ubah(Math.floor(x / 1000)) + " ribu" + (x % 1000 ? " " + ubah(x % 1000) : "");
    if (x < 1000000000) return ubah(Math.floor(x / 1000000)) + " juta" + (x % 1000000 ? " " + ubah(x % 1000000) : "");
    return ubah(Math.floor(x / 1000000000)) + " miliar" + (x % 1000000000 ? " " + ubah(x % 1000000000) : "");
  }
  if (n === 0) return "Nol rupiah";
  const t = ubah(n).replace(/\s+/g, " ").trim();
  return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah";
}

const readAsDataURL = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(new Error("Berkas gagal dibaca."));
  r.readAsDataURL(file);
});
const loadImage = src => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = () => rej(new Error("Gambar tidak terbaca."));
  i.src = src;
});

/* Foto dikecilkan di HP peserta sebelum dikirim, supaya hemat kuota. */
async function siapkanBerkas(file, mode) {
  if (file.size > 10 * 1024 * 1024) throw new Error("Ukuran berkas maksimal 10 MB.");
  // Pas foto cukup kecil: hemat penyimpanan, tetap tajam untuk sertifikat.
  const sisiMaks = mode === "pasfoto" ? 600 : 1400;
  const mutu = mode === "pasfoto" ? 0.72 : 0.7;
  if (file.type.startsWith("image/")) {
    const url = await readAsDataURL(file);
    const img = await loadImage(url);
    const skala = Math.min(1, sisiMaks / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * skala);
    c.height = Math.round(img.height * skala);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", mutu));
    return {
      nama: file.name,
      tipe: "image/jpeg",
      blob,
      pratinjau: URL.createObjectURL(blob)
    };
  }
  if (file.type === "application/pdf") {
    if (mode === "pasfoto") throw new Error("Pas foto harus berupa gambar JPG atau PNG, bukan PDF.");
    if (file.size > 5 * 1024 * 1024) throw new Error("PDF maksimal 5 MB. Foto berkasnya saja juga boleh.");
    return {
      nama: file.name,
      tipe: "application/pdf",
      blob: file,
      pratinjau: null
    };
  }
  throw new Error("Format harus foto (JPG/PNG) atau PDF.");
}
async function unggahKeGudang(folder, kunci, b) {
  if (!b) return null;
  const ext = b.tipe === "application/pdf" ? "pdf" : "jpg";
  const path = `${folder}/${kunci}.${ext}`;
  const {
    error
  } = await SB.storage.from("bukti").upload(path, b.blob, {
    contentType: b.tipe,
    upsert: false
  });
  if (error) {
    const pesan = /row-level security|violates/i.test(error.message || "") ? "Berkas gagal diunggah karena izin di server. Hubungi admin DEWAMEDIK." : "Berkas gagal diunggah: " + error.message;
    throw new Error(pesan);
  }
  return path;
}

function urlFoto(jalur) {
  if (!jalur) return null;
  if (/^https?:\/\//i.test(jalur)) return jalur;
  const {

  } = SB.storage.from("publik").getPublicUrl(jalur);
  return data ? data.publicUrl : null;
}

      setModePulih(false);
      setPesanPulih("Kata sandi baru tersimpan. Pakai yang ini untuk masuk berikutnya.");
      try { history.replaceState(null, "", location.pathname + "#admin"); } catch (e) {}
      try { await SB.auth.signOut(); } catch (e) {}
    } catch (e) {
      setErr("Gagal menyimpan: " + e.message);
    }

  }

function TabProspek({ beriTahu }) {
  const [baris, setBaris] = useState(null);
  const [cari, setCari] = useState("");

  async function muat() {
    const { data, error } = await SB.from("prospek")
      .select("*").order("dibuat_pada", { ascending: false }).limit(1000);
    if (error) return beriTahu("Gagal memuat: " + error.message);
    setBaris(data || []);
  }
  useEffect(() => { muat(); }, []);

  function jam(iso) {
    if (!iso) return "—";
    try {
      return new Date(iso).toLocaleString("id-ID", {
        day: "numeric", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return iso; }
  }
  function tampilWa(w) {
    const d = String(w || "");
    return d.slice(0, 2) === "62" ? "+62 " + d.slice(2) : d;
  }

  const semua = baris || [];
  const kata = cari.trim().toLowerCase();
  const pakai = kata
    ? semua.filter(r => (r.nama + " " + r.whatsapp + " " + (r.email || "") + " " + (r.kampanye || "")).toLowerCase().indexOf(kata) > -1)
    : semua;

  const kini = Date.now();
  const hariIni = semua.filter(r => kini - new Date(r.dibuat_pada).getTime() < 86400000).length;
  const pekanIni = semua.filter(r => kini - new Date(r.dibuat_pada).getTime() < 604800000).length;

  function simpanBerkas(blob, namaBerkas) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = namaBerkas;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function unduhCsv(tgl) {
    const sel = v => {
      const t = String(v == null ? "" : v);
      return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const isi = ["Nama;WhatsApp;Email;Asal;Waktu"].concat(
      semua.map(r => [r.nama, tampilWa(r.whatsapp), r.email || "", r.kampanye || "", jam(r.dibuat_pada)].map(sel).join(";"))
    ).join("\r\n");
    simpanBerkas(new Blob(["﻿" + isi], { type: "text/csv;charset=utf-8" }),
                 "pelihat-harga-" + tgl + ".csv");
  }

  /* Pustaka Excel diambil hanya saat tombolnya ditekan, supaya
     halaman tidak jadi berat untuk pengunjung biasa. */
  function muatPustakaExcel() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((selesai, gagal) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      sc.onload = () => window.XLSX ? selesai(window.XLSX) : gagal(new Error("Pustaka tidak siap"));
      sc.onerror = () => gagal(new Error("Pustaka gagal diunduh"));
      document.head.appendChild(sc);
    });
  }

  async function unduh() {
    const tgl = new Date().toISOString().slice(0, 10);
    if (!semua.length) return beriTahu("Belum ada data untuk diunduh.");
    try {
      const XLSX = await muatPustakaExcel();
      const baris = semua.map(r => ({
        Nama: r.nama,
        WhatsApp: tampilWa(r.whatsapp),
        Email: r.email || "",
        Asal: r.kampanye || "",
        Waktu: jam(r.dibuat_pada)
      }));
      const lembar = XLSX.utils.json_to_sheet(baris);
      lembar["!cols"] = [{ wch: 28 }, { wch: 20 }, { wch: 30 }, { wch: 20 }, { wch: 22 }];
      const buku = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(buku, lembar, "Pelihat Harga");
      const isi = XLSX.write(buku, { bookType: "xlsx", type: "array" });
      simpanBerkas(
        new Blob([isi], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }),
        "pelihat-harga-" + tgl + ".xlsx"
      );
    } catch (e) {
      beriTahu("Excel gagal dibuat, diunduh sebagai CSV.");
      unduhCsv(tgl);
    }
  }

  if (baris === null) {
    return React.createElement("p", { className: "dm-load" }, "Memuat data pelihat harga…");
  }

  return React.createElement("section", { className: "dm-card" },
    React.createElement("div", { className: "dm-toolbar" },
      React.createElement("h3", null, "Pelihat Harga — orang yang membuka biaya pelatihan"),
      React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
        React.createElement("button", { className: "dm-btn-line", onClick: muat }, "Muat ulang"),
        React.createElement("button", { className: "dm-btn-line", onClick: unduh }, "Unduh Excel")
      )
    ),
    React.createElement("p", { className: "dm-hint" },
      semua.length + " orang tercatat · " + hariIni + " dalam 24 jam terakhir · " +
      pekanIni + " dalam 7 hari terakhir. Nomor sudah dipastikan nomor seluler Indonesia."
    ),
    React.createElement("input", {
      className: "dm-input",
      style: { maxWidth: 320, marginBottom: 14 },
      type: "search",
      placeholder: "Cari nama atau nomor…",
      value: cari,
      onChange: e => setCari(e.target.value)
    }),
    pakai.length === 0
      ? React.createElement("p", { className: "dm-kosong" },
          semua.length ? "Tidak ada yang cocok dengan pencarian ini."
                       : "Belum ada yang membuka biaya pelatihan.")
      : React.createElement("div", { className: "dm-tabel-bungkus" },
          React.createElement("table", { className: "dm-tabel" },
            React.createElement("thead", null,
              React.createElement("tr", null,
                React.createElement("th", null, "Nama"),
                React.createElement("th", null, "WhatsApp"),
                React.createElement("th", null, "Email"),
                React.createElement("th", null, "Asal"),
                React.createElement("th", null, "Waktu"),
                React.createElement("th", null, "")
              )
            ),
            React.createElement("tbody", null,
              pakai.map(r => React.createElement("tr", { key: r.id },
                React.createElement("td", null, React.createElement("b", null, r.nama)),
                React.createElement("td", { className: "dm-mono" }, tampilWa(r.whatsapp)),
                React.createElement("td", null, r.email
                  ? React.createElement("a", { href: "mailto:" + r.email }, r.email)
                  : "—"),
                React.createElement("td", { className: "dm-mono" }, r.kampanye || "—"),
                React.createElement("td", null, jam(r.dibuat_pada)),
                React.createElement("td", null,
                  React.createElement("a", {
                    className: "dm-btn-line",
                    style: { textDecoration: "none" },
                    href: "https://wa.me/" + r.whatsapp,
                    target: "_blank",
                    rel: "noreferrer"
                  }, "WhatsApp")
                )
              ))
            )
          )
        )
  );
}

    const { error } = await SB.from("kerjasama_pengajuan")
      .update({ status, diperbarui: new Date().toISOString() }).eq("id", r.id);

    const { error } = await SB.from("kerjasama_pengajuan")
