/* Tautan pendek: daftarpelatihan.dewamedik911.com/DewaBTCLS-SMGNOV
   dialihkan ke halaman link kelas (?k=dewabtcls-smgnov).
   Huruf besar/kecil tidak berpengaruh. */
(function () {
  var p = decodeURIComponent(location.pathname || "").replace(/^\/+|\/+$/g, "");
  var s = p.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  var tujuan = /^[a-z0-9][a-z0-9-]{0,58}[a-z0-9]$/.test(s) && p.indexOf("/") < 0 ? "/?k=" + s : "/";
  location.replace(tujuan);
})();
</script>
